services:
  postgres:
    image: postgres:17-alpine
    container_name: ailiteracy-postgres
    environment:
      POSTGRES_USER: ailiteracy
      POSTGRES_PASSWORD: ailiteracy
      POSTGRES_DB: ailiteracy
    ports:
      - "5432:5432"
    volumes:
      - ailiteracy-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ailiteracy -d ailiteracy"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: .
    container_name: ailiteracy-backend
    profiles: ["full"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql://ailiteracy:ailiteracy@postgres:5432/ailiteracy?schema=public
      PORT: "4000"
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  ailiteracy-pgdata:
